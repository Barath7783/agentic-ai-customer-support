services:
  - type: web
    name: agentic-customer-support-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    plan: free

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: MODEL_NAME
        value: gemini-3.8-flash

      - key: DATABASE_URL
        fromDatabase:
          name: customer-support-db
          property: connectionString

  - type: web
    name: agentic-customer-support-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_URL
        value: https://agentic-customer-support-api.onrender.com

databases:
  - name: customer-support-db
    plan: free
    postgresMajorVersion: "18"