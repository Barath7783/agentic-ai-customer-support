services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: customer_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/customer_support
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
